<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Habit Tracker</title>
    <style>
    
        /* -------------------------------------------------------------
             DARK ADVANCED THEME — preserves all ids, classNames & JS
             only CSS variables, selectors, backdrop effects, animations
        ------------------------------------------------------------- */
        :root {
            /* dark base — smooth deep background, neon‑touched accents */
            --bg-body: #0c0f15;
            --surface: #1a1e26;
            --surface-hover: #252b36;
            --border-subtle: #2d3440;
            --border-strong: #404b5c;
            --text-primary: #e9edf2;
            --text-secondary: #a6b3cc;
            --text-muted: #6f7c94;
            --primary-accent: #27c46f;        /* fresh mint green */
            --primary-glow: rgba(39, 196, 111, 0.25);
            --accent-blue: #4d8cff;
            --danger-accent: #ff5f6d;
            --danger-glow: rgba(255, 95, 109, 0.2);
            --chart-line: #4d8cff;
            --chart-fill-start: rgba(77, 140, 255, 0.25);
            --chart-fill-end: rgba(77, 140, 255, 0.02);
            --shadow-elevation: 0 10px 30px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(75, 130, 200, 0.1) inset;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --transition-smooth: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(45, 140, 255, 0.03) 0%, transparent 40%),
                              radial-gradient(circle at 90% 70%, rgba(39, 196, 111, 0.03) 0%, transparent 40%);
            font-weight: 400;
            line-height: 1.5;
        }

        /* toolbar – glass‑morphism meets dark surface */
        .toolbar {
            background: rgba(26, 30, 38, 0.8);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border: 1px solid rgba(64, 75, 92, 0.5);
            box-shadow: 0 12px 30px -10px black, 0 0 0 1px rgba(77, 140, 255, 0.15) inset;
            padding: 15px 25px;
            border-radius: var(--radius-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(130deg, #b3e6ff, #9effb4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            text-shadow: 0 0 10px rgba(77, 140, 255, 0.4);
        }

        .brand p {
            margin: 4px 0 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* button base — advanced dark mode */
        button {
            padding: 8px 20px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-secondary);
            border-radius: 30px;                /* pill shape */
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3), 0 1px 0 rgba(255, 255, 255, 0.03) inset;
            backdrop-filter: blur(5px);
            letter-spacing: 0.3px;
        }

        button:hover {
            background: var(--surface-hover);
            border-color: var(--primary-accent);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(39, 196, 111, 0.3);
        }

        .btn-primary {
            background: linear-gradient(145deg, #1f8a4f, #13663a);
            border: none;
            color: white;
            font-weight: 600;
            box-shadow: 0 6px 14px rgba(39, 196, 111, 0.3), 0 0 0 1px rgba(255,255,255,0.06) inset;
        }

        .btn-primary:hover {
            background: linear-gradient(145deg, #27c46f, #188f4b);
            box-shadow: 0 12px 22px -6px #27c46f;
            border: none;
            transform: translateY(-2px);
        }

        #monthDisplay {
            font-weight: 600;
            min-width: 130px;
            text-align: center;
            color: var(--text-primary);
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid var(--border-strong);
            letter-spacing: 0.5px;
        }

        /* main layout cards – deep, elevated surfaces */
        .main-layout {
            display: flex;
            flex-direction: column;
        }

       .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 35px -12px black, 0 0 0 1px rgba(77, 140, 255, 0.15) inset;
            padding: 28px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(2px);
            transition: var(--transition-smooth);
        }

        .card:hover {
            box-shadow: 0 24px 45px -12px black, 0 0 0 1px var(--primary-accent) inset;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-primary);
            font-size: 1.4rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, var(--primary-accent), var(--accent-blue)) 1;
            border-bottom-style: solid;
            padding-bottom: 12px;
            display: inline-block;
            letter-spacing: -0.2px;
        }

        /* table wrapper – custom scroll & crisp borders */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            background: #13171f;   /* slightly deeper for contrast */
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
            background: transparent;
        }

        th {
            background-color: #1f2632;
            color: var(--primary-accent);
            font-weight: 600;
            padding: 15px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: 2px solid var(--primary-accent);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            backdrop-filter: blur(4px);
            box-shadow: 0 1px 0 var(--border-strong) inset;
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-subtle);
            text-align: center;
            transition: background 0.15s;
            color: var(--text-secondary);
        }

        tr:hover td {
            background-color: #242b37;
        }

        .habit-name {
            text-align: left !important;
            font-weight: 600;
            color: var(--text-primary);
            padding-left: 20px !important;
            min-width: 210px;
            font-size: 1rem;
            border-right: 1px solid var(--border-subtle);
        }

        /* checkboxes – neon green accent */
        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--primary-accent);
            filter: drop-shadow(0 0 6px rgba(39, 196, 111, 0.5));
            transform: scale(1.1);
            transition: transform 0.1s;
        }
        input[type="checkbox"]:hover { transform: scale(1.25); }

        .input-group {
            display: flex;
            gap: 12px;
            background: #13171f;
            padding: 18px 20px;
            border-radius: 50px;                /* super pill */
            border: 1px solid var(--border-strong);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.02);
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid var(--border-subtle);
            border-radius: 40px;
            font-size: 1rem;
            background: #0d121b;
            color: var(--text-primary);
            transition: var(--transition-smooth);
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
        }

        input[type="text"]:focus {
            border-color: var(--primary-accent);
            background: #111722;
            box-shadow: 0 0 0 3px var(--primary-glow), inset 0 2px 5px black;
        }

        /* status bar with animated glow */
        .status-bar {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            border-radius: 40px;
            background: #1a1f29;
            border: 1px solid var(--border-strong);
            backdrop-filter: blur(2px);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4f5b6b;
            box-shadow: 0 0 8px currentColor;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .saved .dot {
            background: var(--primary-accent);
            box-shadow: 0 0 14px #27c46f;
        }

        .saving .dot {
            background: var(--accent-blue);
            animation: pulse-blue 1.2s infinite ease-in-out;
            box-shadow: 0 0 12px #4d8cff;
        }

        .error .dot {
            background: var(--danger-accent);
            box-shadow: 0 0 14px #ff5f6d;
        }

        @keyframes pulse-blue {
            0% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); background: #7aabff; }
            100% { opacity: 0.7; transform: scale(1); }
        }

        /* chart container – dark with subtle glow */
        .chart-container {
            background: #13171f;
            border-radius: var(--radius-md);
            padding: 15px;
            border: 1px solid var(--border-strong);
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 8px 18px black;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
            filter: drop-shadow(0 4px 10px rgba(39, 196, 111, 0.2));
        }

        /* small stats line */
        #maxScoreLabel {
            color: var(--primary-accent);
            font-weight: 700;
            background: #1e2531;
            padding: 3px 12px;
            border-radius: 30px;
            margin: 0 4px;
            border: 1px solid #2f3b4b;
        }

        /* habit delete X – more elegant */
        .habit-name span {
            color: var(--danger-accent) !important;
            opacity: 0.8 !important;
            font-size: 1.2rem;
            font-weight: 500;
            transition: var(--transition-smooth);
            background: rgba(255,95,109,0.1);
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .habit-name span:hover {
            opacity: 1 !important;
            background: rgba(255,95,109,0.25);
            transform: scale(1.15);
            box-shadow: 0 0 12px var(--danger-glow);
        }

        /* responsive adaptation */
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: flex-start; }
            .card { padding: 20px; }
        }

        /* custom scrollbar for webkit (dark) */
        .table-wrapper::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .table-wrapper::-webkit-scrollbar-track {
            background: #1a1f29;
            border-radius: 10px;
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: #3a4555;
            border-radius: 10px;
            border: 2px solid #1a1f29;
        }
        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--primary-accent);
        }

        /* delete button on toolbar separator */
        .nav-controls > div[style*="background:var(--border)"] {
            background: var(--border-strong) !important;
            width: 2px !important;
            height: 24px !important;
            opacity: 0.5;
        }

        /* subtle placeholder style */
        input::placeholder { color: #536277; font-style: italic; }

</style>
</head>
<body>
    <div class="toolbar">
        <div class="brand"><h1>Ultimate Tracker</h1><p>HD Auto-Save Edition</p></div>
        <div class="nav-controls">
            <button onclick="changeMonth(-1)">❮ Prev</button>
            <span id="monthDisplay" style="font-weight:700; min-width:120px; text-align:center; color:var(--text-main)">Jan 2025</span>
            <button onclick="changeMonth(1)">Next ❯</button>
            <div style="width:1px; height:20px; background:var(--border); margin:0 5px;"></div>
            <button class="btn-primary" onclick="forceSave()">💾 Save Now</button>
        </div>
    </div>
    <div class="main-layout">
        <div class="card">
            <h2>Daily Habits</h2>
            <div class="table-wrapper">
                <table><thead><tr id="headerRow"></tr></thead><tbody id="gridBody"></tbody></table>
            </div>
            <div class="input-group">
                <input type="text" id="newHabit" placeholder="Type a new habit here..." autocomplete="off">
                <button class="btn-primary" onclick="addHabit()">+ Add</button>
            </div>
            <div class="status-bar" id="statusBar"><div class="dot"></div> <span>Connecting to server...</span></div>
        </div>
        <div class="card">
            <h2>Progress Trend</h2>
            <p style="color:var(--text-sub); font-size:0.9rem; margin-top:-10px;">Points per day</p>
            <div class="chart-container"><canvas id="chartCanvas"></canvas></div>
            <div style="text-align:center; margin-top:15px; font-size:0.85rem; color:var(--text-sub);">
                <span id="maxScoreLabel">Max: 0</span> points possible
            </div>
        </div>
    </div>
    <script>
        let currentDate = new Date();
        let trackerData = { habits: [], checks: {} };
        let saveTimeout;

        async function loadData() {
            try {
                // Using 'localhost' is generally more stable than 127.0.0.1 for local apps
                const res = await fetch('http://localhost:8080/load', { method: 'GET', mode: 'cors' });
                if (!res.ok) throw new Error("Server Error");
                const data = await res.json();
                trackerData = data;
                updateStatus("Connected & Ready", "saved");
                renderApp();
            } catch (e) {
                console.error(e);
                updateStatus("Connection Failed. Restart Python?", "error");
                alert("Server connection failed. Please restart the Python script.");
            }
        }

        async function saveData(showMsg = false) {
            updateStatus("Syncing...", "saving");
            try {
                const res = await fetch('http://localhost:8080/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(trackerData)
                });
                if(showMsg) updateStatus("Saved to Disk", "saved");
                else updateStatus("Synced", "saved");
            } catch (e) { updateStatus("Save Failed", "error"); }
        }

        function updateStatus(msg, type) {
            const el = document.getElementById('statusBar');
            el.innerHTML = `<div class="dot"></div> <span>${msg}</span>`;
            el.className = "status-bar " + type;
        }

        function triggerAutoSave() {
            updateStatus("Pending...", "saving");
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => saveData(false), 1000); 
        }
        function forceSave() { saveData(true); }

        function getMonthKey() { return currentDate.getFullYear() + "-" + String(currentDate.getMonth()+1).padStart(2,'0'); }

        function renderApp() {
            const key = getMonthKey();
            if(!trackerData[key]) trackerData[key] = { habits: ["Eat Healthy", "Exercise 45m", "Drink Water"], checks: {} };
            const monthData = trackerData[key];
            const days = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0).getDate();
            
            document.getElementById('monthDisplay').innerText = currentDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            let hHTML = "<th>Habit Name</th>";
            for(let i=1; i<=days; i++) hHTML += `<th>${i}</th>`;
            document.getElementById('headerRow').innerHTML = hHTML;

            let bHTML = "";
            monthData.habits.forEach((habit, r) => {
                bHTML += `<tr><td class="habit-name">${habit} <span style="color:var(--danger); cursor:pointer; float:right; opacity:0.6;" onclick="deleteHabit(${r})" title="Delete">&times;</span></td>`;
                if(!monthData.checks[r]) monthData.checks[r] = [];
                while(monthData.checks[r].length < days) monthData.checks[r].push(false);
                for(let d=0; d<days; d++) {
                    const chk = monthData.checks[r][d] ? 'checked' : '';
                    bHTML += `<td><input type="checkbox" ${chk} onchange="toggle(${r}, ${d})"></td>`;
                }
                bHTML += "</tr>";
            });
            document.getElementById('gridBody').innerHTML = bHTML;
            drawChart(monthData, days);
        }

        function toggle(r, d) {
            const key = getMonthKey();
            trackerData[key].checks[r][d] = !trackerData[key].checks[r][d];
            triggerAutoSave(); 
            renderApp();
        }
        function addHabit() {
            const val = document.getElementById('newHabit').value.trim();
            if(!val) return;
            const key = getMonthKey();
            const days = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0).getDate();
            trackerData[key].habits.push(val);
            trackerData[key].checks[trackerData[key].habits.length-1] = new Array(days).fill(false);
            document.getElementById('newHabit').value = "";
            triggerAutoSave();
            renderApp();
        }
        function deleteHabit(idx) {
            if(!confirm("Delete this habit permanently?")) return;
            const key = getMonthKey();
            trackerData[key].habits.splice(idx, 1);
            delete trackerData[key].checks[idx];
            triggerAutoSave();
            renderApp();
        }
        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            const key = getMonthKey();
            if(!trackerData[key]) trackerData[key] = { habits: ["New Habit"], checks: {} };
            renderApp();
        }

        function drawChart(data, days) {
            const canvas = document.getElementById('chartCanvas');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            const w = rect.width, h = rect.height, p = 30;
            ctx.clearRect(0,0,w,h);
            const scores = [];
            for(let d=0; d<days; d++) {
                let s=0;
                for(let r=0; r<data.habits.length; r++) if(data.checks[r] && data.checks[r][d]) s++;
                scores.push(s);
            }
            const max = data.habits.length || 1;
            document.getElementById('maxScoreLabel').innerText = max;
            ctx.strokeStyle='#eee'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(p, h-p); ctx.lineTo(w-p, h-p); ctx.stroke();
            const xStep = (w-2*p)/(days-1);
            const yScale = (h-2*p)/max;
            const pts = scores.map((s,i) => ({ x: p+i*xStep, y: h-p-(s*yScale) }));
            if(pts.length>1) {
                ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
                pts.forEach(pt => ctx.lineTo(pt.x, pt.y));
                ctx.strokeStyle = '#16e492'; ctx.lineWidth = 3; ctx.stroke();
                ctx.lineTo(pts[pts.length-1].x, h-p); ctx.lineTo(pts[0].x, h-p); ctx.closePath();
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, "rgba(0, 0, 0, 0)"); grad.addColorStop(1, " rgba(0, 85, 255, 0.345)");
                ctx.fillStyle = grad; ctx.fill();
            }
            pts.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x,pt.y,4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.strokeStyle='#2b579a'; ctx.lineWidth=2; ctx.fill(); ctx.stroke(); });
        }
        window.addEventListener('resize', renderApp);
        window.onload = loadData;
    </script>
</body>
</html>
