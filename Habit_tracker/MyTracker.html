<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker · Dark Premium</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* -------------------------------------------------------------
            DARK PREMIUM THEME — your exact colors and style
        ------------------------------------------------------------- */

        :root {
            --bg-body: #0a0c12;
            --surface-1: #141a24;
            --surface-2: #1e2632;
            --surface-3: #2a3342;
            --border-light: #2d3748;
            --border-medium: #3e4a5d;
            --primary-green: #27c46f;
            --green-glow: rgba(39, 196, 111, 0.35);
            --red-missed: #ff4d4d;
            --text-primary: #f0f4fa;
            --text-secondary: #b8c4d9;
            --text-muted: #8190aa;
            --shadow-card: 0 20px 35px -10px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(57, 153, 255, 0.1) inset;
            --radius-card: 24px;
            --radius-element: 16px;
            --transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            background-image: radial-gradient(circle at 20% 30%, rgba(39, 196, 111, 0.03) 0%, transparent 40%);
            font-size: 14px;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            background: rgba(20, 26, 36, 0.85);
            backdrop-filter: blur(16px) saturate(200%);
            border: 1px solid rgba(57, 153, 255, 0.15);
            border-bottom: 1px solid rgba(39, 196, 111, 0.25);
            box-shadow: 0 16px 30px -12px black;
            padding: 12px 20px;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #9effb4, #7ac7ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .brand h1 i {
            color: var(--primary-green);
        }

        /* ===== MAIN LAYOUT ===== */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--surface-1);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 22px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(57, 153, 255, 0.08);
        }


        /* ===== GALLERY ===== */
        .gallery {
            display: flex;
            gap: 20px;
            margin: 0;
            flex-direction: column;
        }

        .gallery-item {
            background: var(--surface-2);
            border-radius: var(--radius-element);
            overflow: hidden;
            border: 1px solid var(--border-light);
            transition: var(--transition);
            box-shadow: 0 15px 25px -10px black;
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            border-color: var(--primary-green);
            box-shadow: 0 22px 30px -12px black;
        }

        .image-container {
            background: var(--surface-3);
            overflow: hidden;
            border-bottom: 2px solid var(--border-medium);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s;
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        .caption {
            padding: 14px;
        }

        .caption h3 {
            font-size: 1rem;
            color: var(--primary-green);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== DOWNLOAD SECTION ===== */
        .download-section {
    background: var(--surface-2);
    border-radius: 50px;
    padding: 30px 20px;
    text-align: center;
    border: 2px dashed var(--primary-green);
    margin: 0;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7), 0 15px 30px -10px black;
    display: flex;
    flex-direction: row;
    align-content: center;
    align-items: center;
    justify-content: space-around;
}
        .download-btn {
            display: inline-block;
            background: linear-gradient(145deg, #1f8a4f, #0f5f37);
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            padding: 1.2rem 4rem;
            border-radius: 60px;
            text-decoration: none;
            box-shadow: 0 12px 0 #0a351e, 0 18px 30px rgba(39, 196, 111, 0.4);
            transition: 0.1s linear;
            border: 1px solid rgba(255,255,255,0.2);
            margin: 1rem 0;
        }

        .download-btn i {
            margin-right: 15px;
            font-size: 2rem;
        }

        .download-btn:hover {
            background: linear-gradient(145deg, #27c46f, #188f4b);
            transform: translateY(-4px);
            box-shadow: 0 16px 0 #0a351e, 0 25px 35px -5px var(--primary-green);
        }

        .download-btn:active {
            transform: translateY(8px);
            box-shadow: 0 6px 0 #0a351e;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .gallery {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .download-btn {
                font-size: 1.2rem;
                padding: 1rem 2rem;
            }
            .download-btn i {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="brand">
            <h1>
                <i class="fas fa-solid fa-fire"></i> Habit Tracker
            </h1>
        </div>
    </div>

    <div class="main-layout">
        <!-- GALLERY SECTION - 5 Screenshots -->
        <div class="card">
            <h2><i class="fas fa-camera" style="margin-right: 10px;"></i> Tracker Preview</h2>
            <div class="gallery">
                <!-- 1. Habit List -->
                <div class="gallery-item">
                    <div class="image-container">
                        <img src="Screenshot 2026-03-03 005132.png" 
                             alt="Complete habit list">
                    </div>
                    <div class="caption">
                        <h3><i class="fas fa-list-check"></i> Complete Habit List</h3>
                    </div>
                </div>
                
                <!-- 2. Progress Analytics -->
                <div class="gallery-item">
                    <div class="image-container">
                        <img src="Screenshot 2026-03-03 005207.png" 
                             alt="Progress analytics">
                    </div>
                    <div class="caption">
                        <h3><i class="fas fa-chart-pie"></i> Progress Analytics</h3>
                    </div>
                </div>
                
                <!-- 3. Morning Routine -->
                <div class="gallery-item">
                    <div class="image-container">
                        <img src="Screenshot 2026-03-03 005222.png" 
                             alt="Morning habits">
                    </div>
                    <div class="caption">
                        <h3><i class="fas fa-sun"></i> Morning Routine</h3>
                    </div>
                </div>
                
                <!-- 4. Evening Habits -->
                <div class="gallery-item">
                    <div class="image-container">
                        <img src="Screenshot 2026-03-03 005239.png" 
                             alt="Evening habits">
                    </div>
                    <div class="caption">
                        <h3><i class="fas fa-moon"></i> Evening Habits</h3>
                    </div>
                </div>
                
                <!-- 5. Weekly Breakdown -->
                <div class="gallery-item">
                    <div class="image-container">
                        <img src="Screenshot 2026-03-03 005309.png" 
                             alt="Weekly breakdown">
                    </div>
                    <div class="caption">
                        <h3><i class="fas fa-calendar-week"></i> Weekly Breakdown</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- DOWNLOAD SECTION -->
        <div class="download-section">
            <h2 style="border: none; margin-bottom: 10px;"><i class="fas fa-download"></i> Download Full Tracker</h2>
            <a href="Habit_tracker.zip" class="download-btn" download>
                <i class="fas fa-file-archive"></i> Click here to download...
            </a>
        </div>
    </div>
</body>
</html>
